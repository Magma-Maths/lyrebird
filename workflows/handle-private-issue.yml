# Install in the PRIVATE repo at .github/workflows/handle-private-issue.yml
#
# Handles native issue events on the private repo (close, reopen, label changes).

name: Handle private issue events

on:
  issues:
    types: [closed, reopened, labeled, unlabeled, typed, untyped, milestoned, demilestoned]

# Shared env vars — available to all jobs/steps.
env:
  PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
  PRIVATE_REPO: ${{ vars.PRIVATE_REPO }}
  BOT_LOGIN: ${{ vars.BOT_LOGIN }}
  EVENT_NAME: ${{ github.event_name }}
  EVENT_SOURCE: private
  EVENT_PAYLOAD: ${{ toJson(github.event) }}
  # Resolution labels: maps resolution key → private label, public
  # close note, and GitHub state_reason.  Customise as needed.
  RESOLUTION_LABELS: >-
    {
      "completed":        {"label": "resolution:completed",        "note": "This has been fixed and will be available in the next update. Thanks for the report. If you still see this after updating, please comment here with details.", "state_reason": "completed"},
      "not-planned":      {"label": "resolution:not-planned",      "note": "Closing as not planned at this time. Thanks for taking the time to report it.",                               "state_reason": "not_planned"},
      "cannot-reproduce": {"label": "resolution:cannot-reproduce", "note": "We could not reproduce this with the information available. If you can share steps/logs, we can reopen.",      "state_reason": "not_planned"},
      "custom":           {"label": "resolution:custom",           "note": "",                                                                                                            "state_reason": null}
    }
  # Area coverage: maps each area label → its default assignee login.  When
  # an area label is added to a private issue that has no assignee yet, the
  # bot assigns that person; existing assignments are never overridden.
  # Source of truth is the "Area coverage" spreadsheet — keep this in sync by
  # hand when it changes.  Areas with no owner in the sheet are intentionally
  # omitted (Calculator, Groebner Bases, Invariant Theory, Noncommutative
  # Algebra) — no label there means no auto-assignment.
  AREA_ASSIGNEES: >-
    {
      "Language":                    "GeoffBailey",
      "Aggregates":                  "GeoffBailey",
      "Rings":                       "GeoffBailey",
      "Linear Algebra":              "AllanKSteel",
      "Modules":                     "AllanKSteel",
      "Commutative Algebra":         "AllanKSteel",
      "Lattices":                    "assaferan",
      "Quadratic Forms":             "assaferan",
      "Modular Arithmetic Geometry": "assaferan",
      "Global Fields":               "NicoleSutherland",
      "Local Fields":                "NicoleSutherland",
      "Finite Groups":               "Bill-Unger",
      "Finitely-presented Groups":   "Bill-Unger",
      "Representation Theory":        "Bill-Unger",
      "Algebras":                    "jvoight",
      "Lie Theory":                  "rolyat",
      "Algebraic Geometry":          "StephanElsenhans",
      "Arithmetic Geometry":         "StephanElsenhans",
      "Topology":                    "ReymondAkpanya",
      "Geometry":                    "ReymondAkpanya",
      "Combinatorics":               "rhysje00",
      "Coding Theory":               "edgarcosta",
      "Cryptography":                "edgarcosta",
      "Optimization":                "edgarcosta"
    }

jobs:
  handle:
    if: github.repository == vars.PRIVATE_REPO
    concurrency:
      group: private-issue-${{ github.event.issue.node_id }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    steps:
      - name: Checkout lyrebird
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.LYREBIRD_REPO }}
          path: lyrebird

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lyrebird
        run: pip install ./lyrebird

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LYREBIRD_APP_ID }}
          private-key: ${{ secrets.LYREBIRD_APP_PRIVATE_KEY }}
          repositories: ${{ vars.PUBLIC_REPO_NAME }},${{ vars.PRIVATE_REPO_NAME }}
          owner: ${{ github.repository_owner }}

      - name: Run handler
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_ACTION: ${{ github.event.action }}
        run: python -m lyrebird

  delayed-close-check:
    if: github.repository == vars.PRIVATE_REPO && github.event.action == 'closed'
    needs: handle
    runs-on: ubuntu-slim
    steps:
      - name: Wait 5 minutes
        run: sleep 300

      - name: Checkout lyrebird
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.LYREBIRD_REPO }}
          path: lyrebird

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lyrebird
        run: pip install ./lyrebird

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LYREBIRD_APP_ID }}
          private-key: ${{ secrets.LYREBIRD_APP_PRIVATE_KEY }}
          repositories: ${{ vars.PUBLIC_REPO_NAME }},${{ vars.PRIVATE_REPO_NAME }}
          owner: ${{ github.repository_owner }}

      - name: Run delayed close check
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_ACTION: closed_check
        run: python -m lyrebird
